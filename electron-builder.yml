appId: com.kimix.app
productName: Kimix
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!src"
  - "!scripts"
  - "!electron"
  - "!**/*.map"
  - "!**/dev.cjs"
extraResources:
  - from: vendor/kimi-code-sdk
    to: vendor/kimi-code-sdk
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/onnxruntime-node/**"
mac:
  files:
    - out/**/*
    - package.json
    - "!src"
    - "!scripts"
    - "!electron"
    - "!**/*.map"
    - "!**/dev.cjs"
    - "!**/onnxruntime-node/bin/napi-v3/{linux,win32}/**"
    - "!**/onnxruntime-web/**"
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  files:
    - out/**/*
    - package.json
    - "!src"
    - "!scripts"
    - "!electron"
    - "!**/*.map"
    - "!**/dev.cjs"
    - "!**/onnxruntime-node/bin/napi-v3/{darwin,linux}/**"
    - "!**/onnxruntime-web/**"
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  verifyUpdateCodeSignature: false
linux:
  files:
    - out/**/*
    - package.json
    - "!src"
    - "!scripts"
    - "!electron"
    - "!**/*.map"
    - "!**/dev.cjs"
    - "!**/onnxruntime-node/bin/napi-v3/{darwin,win32}/**"
    - "!**/onnxruntime-web/**"
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: LiKPO4
nsis:
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kimix
portable:
  artifactName: "${productName}-${version}.${ext}"
# Publish config is passed via CLI in CI
# Local builds use: pnpm pack
# CI releases use: electron-builder --publish always
